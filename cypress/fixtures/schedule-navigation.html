<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule navigation test harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import WorkflowStepper from "/static/frontend/src/routes/SchedulePage/WorkflowStepper.tsx";
      import FoundationWorkspaceNav from "/static/frontend/src/routes/SchedulePage/FoundationWorkspaceNav.tsx";
      import "/static/frontend/src/styles/globals.css";

      const EmptyIcon = () => null;
      const steps = [
        {
          key: "config",
          title: "Grunnlag",
          description: "Sett rammene og samle tilgjengelighet.",
          icon: EmptyIcon,
          status: "Ferdig",
          tone: "success",
          complete: true,
        },
        {
          key: "solver",
          title: "Planutkast",
          description: "Generer og kontroller utkastet.",
          icon: EmptyIcon,
          status: "Klar",
          tone: "muted",
        },
        {
          key: "plan",
          title: "Publisering",
          description: "Publiser endelige tider.",
          icon: EmptyIcon,
          status: "Låst",
          tone: "locked",
          locked: true,
        },
      ];

      const Harness = () => {
        const [activeStep, setActiveStep] = React.useState("config");
        const [activeTab, setActiveTab] = React.useState("framework");
        const [setupDraft, setSetupDraft] = React.useState("");

        return React.createElement(
          "div",
          {
            "data-cy": "navigation-harness",
            style: { margin: "0 auto", maxWidth: 1152, padding: 24 },
          },
          React.createElement(
            "div",
            { className: "border-b border-border bg-surface-base" },
            React.createElement(WorkflowStepper, {
              steps,
              activeKey: activeStep,
              onChange: setActiveStep,
            }),
            React.createElement(FoundationWorkspaceNav, {
              active: activeTab,
              onChange: setActiveTab,
              frameworkComplete: true,
              availabilityComplete: false,
              submittedCount: 1,
              participantCount: 3,
              selectedBlockCount: 0,
            }),
            React.createElement("div", {
              id: "foundation-panel-framework",
              role: "tabpanel",
              "aria-labelledby": "foundation-tab-framework",
              hidden: activeTab !== "framework",
            },
              React.createElement("span", null, "Tidsrammer"),
              React.createElement("span", null, "Intervjublokker"),
              React.createElement("input", {
                "aria-label": "Ulagret oppsettsendring",
                value: setupDraft,
                onChange: (event) => setSetupDraft(event.target.value),
              }),
            ),
            React.createElement("div", {
              id: "foundation-panel-availability",
              role: "tabpanel",
              "aria-labelledby": "foundation-tab-availability",
              hidden: activeTab !== "availability",
            }, React.createElement("span", null, "Min personlige tilgjengelighet")),
            React.createElement("div", {
              id: "foundation-panel-coverage",
              role: "tabpanel",
              "aria-labelledby": "foundation-tab-coverage",
              hidden: activeTab !== "coverage",
            }, React.createElement("span", null, "Dekningsoversikt")),
          ),
        );
      };

      createRoot(document.getElementById("root")).render(
        React.createElement(Harness),
      );
    </script>
  </body>
</html>

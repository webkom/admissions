<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solver setup panel test harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import SolverResults from "/static/frontend/src/components/Scheduling/Solver/SolverResults.tsx";
      import SolverSetupPanel from "/static/frontend/src/components/Scheduling/Solver/SolverSetupPanel.tsx";
      import { DEFAULT_SOLVER_OPTIONS } from "/static/frontend/src/components/Scheduling/Solver/solverHelpers.ts";
      import { deriveSchedulePresentation } from "/static/frontend/src/components/Scheduling/Solver/solverSelectors.ts";
      import "/static/frontend/src/styles/globals.css";

      const h = React.createElement;
      const scenario =
        new URLSearchParams(window.location.search).get("scenario") ?? "ready";
      const ready = scenario !== "blocked";
      const waiting = scenario === "rerun-waiting";
      const result = {
        status: waiting ? "SUCCESS" : "PARTIAL",
        optimal: true,
        schedule: [
          {
            candidate_id: "candidate-1",
            candidate: "Kandidat 1",
            time: 480,
            locked: true,
            panel: [
              {
                id: "interviewer-1",
                name: "Ada",
                is_overtime: false,
              },
            ],
          },
        ],
        unplaceable: waiting
          ? []
          : [
              {
                candidate_id: "candidate-2",
                candidate: "Kandidat 2",
                reason: "Ikke nok intervjukapasitet i de åpne tidslukene.",
              },
            ],
      };
      const interviewers = [
        {
          id: "interviewer-1",
          name: "Ada",
          availability: [480],
          biased: [],
          has_submitted: true,
        },
      ];
      const presentation = deriveSchedulePresentation(result, interviewers, [
        [480],
      ]);
      const draft = {
        presentation,
        lockedAssignments: [],
        canRestoreEditSession: false,
        beginEditSession: () => {},
        restoreEditSession: () => {},
        finishEditSession: () => {},
        timeOptionsFor: () => [480],
        toggleLock: () => {},
        unlockAll: () => {},
        changeTime: () => {},
        moveItems: () => {},
        swapTimes: () => {},
        swapPanelMember: () => {},
        consumeTouchedScheduleIndexes: () => [],
      };
      const assignmentConflicts = {
        assignmentCount: 0,
        affectedCandidateIds: new Set(),
        affectedCandidateNames: new Set(),
        affectedScheduleIndexes: new Set(),
        affectedPanelMemberKeys: new Set(),
        optedOutPanelMemberKeys: new Set(),
      };

      const readiness = ready
        ? {
            ready: true,
            submittedInterviewers: 6,
            enabledSlotCount: 40,
            totalCapacity: 120,
            neededCapacity: 12,
            conflictCount: 0,
            conflictBlockedCandidates: [],
            capabilityBlockedCandidates: [],
            slotsWithFullPanel: 40,
            usableSlotCount: 40,
          }
        : {
            ready: false,
            submittedInterviewers: 4,
            enabledSlotCount: 40,
            totalCapacity: 80,
            neededCapacity: 12,
            conflictCount: 0,
            conflictBlockedCandidates: [],
            capabilityBlockedCandidates: [],
            slotsWithFullPanel: 40,
            usableSlotCount: 40,
          };

      const Harness = () => {
        const [solverOptions, setSolverOptions] = React.useState({
          ...DEFAULT_SOLVER_OPTIONS,
        });
        const [panelSize, setPanelSize] = React.useState(1);
        const [solveCount, setSolveCount] = React.useState(0);
        const [regenerationOpen, setRegenerationOpen] = React.useState(false);
        const [navigationAction, setNavigationAction] = React.useState("");
        const [solverInterviewers, setSolverInterviewers] = React.useState([
          {
            id: "interviewer-1",
            name: "Ada",
            availability: [480],
            biased: [],
            has_submitted: true,
            participation: "participating",
            experience_level: "experienced",
          },
          {
            id: "interviewer-2",
            name: "Grace",
            availability: [480],
            biased: [],
            has_submitted: true,
            participation: "participating",
            experience_level: "experienced",
          },
          {
            id: "interviewer-3",
            name: "Linus",
            availability: [480],
            biased: [],
            has_submitted: false,
            participation: "awaiting_response",
            experience_level: "unknown",
          },
        ]);
        const rerun =
          scenario === "rerun" ||
          scenario === "rerun-saving" ||
          scenario === "rerun-waiting";
        const saving = scenario === "rerun-saving";
        const persistence = {
          state: saving ? "saving" : "saved",
          error: "",
          isSaving: saving,
          hasConflict: false,
          isSaved: !saving,
          retry: () => {},
        };

        const setup = h(SolverSetupPanel, {
          interviewerCount: 6,
          experiencedInterviewerCount: solverInterviewers.filter(
            (interviewer) => interviewer.experience_level === "experienced",
          ).length,
          interviewers: solverInterviewers,
          solverOptions,
          onSolverOptionsChange: setSolverOptions,
          onExperienceLevelChange: (userId, experienceLevel) => {
            setSolverInterviewers((current) =>
              current.map((interviewer) =>
                interviewer.id === userId
                  ? {
                      ...interviewer,
                      experience_level: experienceLevel,
                    }
                  : interviewer,
              ),
            );
            return Promise.resolve();
          },
          panelSize,
          onPanelSizeChange: setPanelSize,
          openBlockCount: 10,
          interviewSlotCount: 40,
          readiness,
          availabilityReady: ready,
          loading: false,
          error: "",
          elapsedMs: 0,
          jobStatus: null,
          estimatedSeconds: 2,
          lockedCount: rerun ? 2 : 0,
          hasProposal: rerun,
          changeableInterviewCount: rerun ? 10 : 0,
          currentDraftReady: true,
          candidateScopeResolved: scenario !== "candidates-loading",
          regenerationOpen,
          onCloseRegeneration: () => setRegenerationOpen(false),
          onSolve: () => setSolveCount((count) => count + 1),
          onCancel: () => {},
          onOpenAvailability: () => setNavigationAction("availability"),
          onOpenFramework: () => setNavigationAction("framework"),
        });

        const results =
          rerun &&
          h(SolverResults, {
            result,
            planRevealed: true,
            solveTick: 1,
            savedSchedule: undefined,
            draft,
            persistence,
            hasLocalDraft: false,
            dates: ["2026-07-20"],
            sessionDuration: 30,
            dayStartMinute: 480,
            dayEndMinute: 1020,
            chunkSize: 4,
            chunkBreakMinutes: 30,
            enabledSlots: new Set(["2026-07-20:480"]),
            editRequestKey: 0,
            assignmentConflicts,
            blockRestPreferenceEnabled: true,
            panelSize: 1,
            proposalStrategy: "balanced",
            canonicalBlocks: [[480]],
            currentReviewRequired: waiting,
            currentReviewComplete: waiting,
            completeReviewerCount: waiting ? 1 : 0,
            requiredReviewerCount: waiting ? 2 : 0,
            pendingReviewerCount: waiting ? 1 : 0,
            missingReviewerNames: waiting ? ["Grace"] : [],
            publicationReady: false,
            solverError: "",
            onOpenSettings: () => setRegenerationOpen(true),
            onOpenConflictReview: () => setNavigationAction("review"),
            onOpenRepair: () => {},
            onRetrySolve: () => {},
            onOpenPlan: () => {},
            onPreviewWithAvailabilityDeviation: () => {},
            previewLoading: false,
          });

        return h(
          "main",
          {
            "data-cy": "solver-setup-harness",
            style: { maxWidth: 980, margin: "0 auto", padding: 24 },
          },
          h(
            "output",
            { "data-cy": "solver-options", hidden: true },
            JSON.stringify(solverOptions),
          ),
          h(
            "output",
            { "data-cy": "panel-size-value", hidden: true },
            panelSize,
          ),
          h(
            "output",
            { "data-cy": "solver-interviewers", hidden: true },
            JSON.stringify(solverInterviewers),
          ),
          h("output", { "data-cy": "solve-count", hidden: true }, solveCount),
          h(
            "output",
            { "data-cy": "navigation-action", hidden: true },
            navigationAction,
          ),
          !rerun
            ? setup
            : regenerationOpen
              ? h(
                  React.Fragment,
                  null,
                  setup,
                  h(
                    "section",
                    { "aria-label": "Gjeldende planutkast" },
                    React.cloneElement(results, { backgroundMode: true }),
                  ),
                )
              : results,
        );
      };

      createRoot(document.getElementById("root")).render(h(Harness));
    </script>
  </body>
</html>
